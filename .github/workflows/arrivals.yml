# Collects new arrivals from JustWatch every 30 minutes and publishes them as arrivals.json on the
# `data` branch, which the addon reads. (JustWatch rate-limits Render's shared addresses, so this
# runs on GitHub instead.)
name: new-arrivals

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch-arrivals.js
      - services.js
      - .github/workflows/arrivals.yml

permissions:
  contents: write

concurrency:
  group: new-arrivals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Get the previous file
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:arrivals.json > previous.json || echo '{}' > previous.json
          else
            echo '{}' > previous.json
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/fetch-arrivals.js previous.json arrivals.json

      - name: Publish to the data branch
        run: |
          mkdir publish && cp arrivals.json publish/ && cd publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arrivals.json
          git commit -q -m "New arrivals $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data
