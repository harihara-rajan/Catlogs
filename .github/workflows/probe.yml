name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node probe.js
      - uses: actions/upload-artifact@v4
        with:
          name: posters
          path: poster-*.jpg
          if-no-files-found: ignore
